name: Generate Snake Animation

on:
  # Run automatically every 12 hours so the snake stays fresh.
  # Minute 17 avoids the top-of-the-hour rush, when GitHub's
  # shared runners are busiest and scheduled jobs get delayed or dropped.
  schedule:
    - cron: "17 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate on every push to the default branch
  push:
    branches:
      - main

permissions:
  contents: write

# Only one snake build at a time; a newer run replaces a queued/running one
concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
